version: '3.8'

services:
  # ─── APS Core Backend API (A1-A5) ─────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aps-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/aps_enterprise}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - API_KEY=${API_KEY:-admin-key-123}
      - JWT_SECRET=${JWT_SECRET:-supersecret_aps_key_2026}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-groq/compound}
      - CRM_PROVIDER=${CRM_PROVIDER:-teleforce}
      - TELEFORCE_CRM_API_URL=${TELEFORCE_CRM_API_URL}
      - TELEFORCE_CRM_CLIENT_SECRET=${TELEFORCE_CRM_CLIENT_SECRET}
      - TELEFORCE_CRM_ORG_ID=${TELEFORCE_CRM_ORG_ID}
      - TELEFORCE_CRM_LOGIN_EMAIL=${TELEFORCE_CRM_LOGIN_EMAIL}
      - DIALER_PROVIDER=${DIALER_PROVIDER:-teleforce}
      - TELEFORCE_DIALER_API_URL=${TELEFORCE_DIALER_API_URL}
      - TELEFORCE_DIALER_ACCOUNT_SID=${TELEFORCE_DIALER_ACCOUNT_SID}
      - TELEFORCE_DIALER_CALLER_ID=${TELEFORCE_DIALER_CALLER_ID}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-doubletick}
      - DOUBLETICK_API_KEY=${DOUBLETICK_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aps-network
    volumes:
      - backend-logs:/app/logs

  # ─── APS React Frontend & Nginx Gateway ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aps-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aps-network

  # ─── Local PostgreSQL Instance (Optional / Offline Standalone)
  db:
    image: postgres:16-alpine
    container_name: aps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aps_enterprise}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aps-network

networks:
  aps-network:
    driver: bridge

volumes:
  pgdata:
  backend-logs:
