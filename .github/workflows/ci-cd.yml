name: APS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Backend Automated Testing & API Contracts ───────────────────────────
  backend-test:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Run Backend Integration & Unit Tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5000
          API_KEY: admin-key-123
          JWT_SECRET: supersecret_ci_key_2026

  # ─── 2. Frontend Production Build Verification ──────────────────────────────
  frontend-build:
    name: Frontend CI & Bundle Optimization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Optimized Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Verify Distribution Artifacts
        working-directory: frontend
        run: |
          test -f dist/index.html || { echo "dist/index.html missing!"; exit 1; }
          test -d dist/assets || { echo "dist/assets directory missing!"; exit 1; }
          echo "Production assets successfully generated."

  # ─── 3. Pre-Flight Release Validation Gate ─────────────────────────────────
  pre-flight:
    name: Pre-Flight Production Readiness Audit
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Backend Environment File (.env)
        run: |
          if [ ! -f backend/.env ] && [ -f backend/.env.example ]; then
            cp backend/.env.example backend/.env
          fi

      - name: Install Dependencies (Root, Backend, Frontend)
        run: |
          npm ci || npm install
          npm ci --prefix backend || npm install --prefix backend
          npm ci --prefix frontend || npm install --prefix frontend

      - name: Run Automated Release Verifier
        run: node scripts/release-verify.js
        env:
          NODE_ENV: test
          PORT: 5000
          API_KEY: admin-key-123
          JWT_SECRET: supersecret_ci_key_2026

  # ─── 4. Docker Build Gate ──────────────────────────────────────────────────
  docker-check:
    name: Container Image Build Verification
    needs: [pre-flight]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: aps-enterprise-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: aps-enterprise-frontend:ci-check
